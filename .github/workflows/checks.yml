# The automatic checks, run by GitHub on every push and every pull request,
# on Windows and on Linux. The same three checks can be run on your own
# computer; CONTRIBUTING.md shows how.
#
# The two actions used are pinned to an exact commit (their version is in the
# comment next to each), so what runs here can't change without a change to
# this file.
#
# Each check runs even when one before it failed, so one run shows the result
# of all three; the run fails if any of them does.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # a newer push replaces a run that is still going, except on main: every
  # commit on main keeps its own result (a release needs one for its commit)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Get the project, with its full history (for the privacy check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the exact Pillow and numpy versions the paints were made with
        id: install
        # wheels only: if a ready-made wheel were ever missing, stop here
        # rather than build Pillow from source, which can draw text differently
        run: "python -m pip install --only-binary=:all: --disable-pip-version-check -r tools/requirements-checks.txt"

      - name: Privacy check (every file, and the full history)
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python tools/privacy_check.py --history

      - name: License check
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python tools/license_check.py

      - name: Build the cars, compare them with the ready-made paints, and check they read the designs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/check_builds.py
